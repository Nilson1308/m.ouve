name: ouvia

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: ouvia-postgis-pgvector:16
    environment:
      POSTGRES_DB: ouvia
      POSTGRES_USER: ouvia
      POSTGRES_PASSWORD: ouvia
    ports:
      - "5434:5432"
    volumes:
      - ouvia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ouvia -d ouvia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  ouvia_pgdata:
