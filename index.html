<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Plataforma inteligente de zeladoria e ouvidoria.">
    <title>M.Ouve - Ouvidoria da Prefeitura Municipal de Mogi das Cruzes</title>
    <script>
      (function () {
        var k = 'ouvia_theme';
        var ok = ['light', 'dark', 'high-contrast'];
        var t = localStorage.getItem(k);
        var theme = ok.indexOf(t) >= 0 ? t : 'light';
        var html = document.documentElement;
        for (var i = 0; i < ok.length; i++) html.classList.remove(ok[i]);
        html.classList.add(theme);
      })();
    </script>

    <!-- Fonte Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
