# M.Ouve — Ouvidoria da Prefeitura Municipal de Mogi das Cruzes (Vue + Django/Gunicorn)
# Domínio: https://ouvidoria.mogidascruzes.sp.gov.br
# SSL termina no proxy reverso municipal; origem HTTP (:80).
#
# Instalação:
#   sudo cp /var/www/ouve/deploy/apache/ouvidoria.conf /etc/apache2/sites-available/ouvidoria.conf
#   sudo a2ensite ouvidoria.conf
#   sudo apache2ctl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName ouvidoria.mogidascruzes.sp.gov.br

    ProxyPreserveHost On

    ErrorLog ${APACHE_LOG_DIR}/ouvidoria_error.log
    CustomLog ${APACHE_LOG_DIR}/ouvidoria_access.log combined

    Include /var/www/ouve/deploy/apache/snippets/django-proxy.inc

    DocumentRoot /var/www/ouve/dist
    <Directory /var/www/ouve/dist>
        Options -Indexes +FollowSymLinks
        FallbackResource /index.html
        Require all granted
    </Directory>
</VirtualHost>
